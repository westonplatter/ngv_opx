[package]
name = "ngv-opx-gpu"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "wgpu/WGSL GPU backends for ngv-opx pricing and IV solving."

[lib]
name = "ngv_opx_gpu"

[dependencies]
ngv-opx-core = { path = "../core", version = "0.1.0" }
wgpu = "23"
pollster = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }
