[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/gpu",
    "bindings/python",
    "bindings/wasm",
]
# python binding builds via maturin (needs Python linker symbols);
# wasm binding builds via wasm-pack (target wasm32-unknown-unknown).
# Exclude both from default `cargo build`/`cargo test` to avoid host-link errors.
default-members = [
    "crates/core",
    "crates/gpu",
]

# Shared package metadata — all crates inherit these via `field.workspace = true`.
[workspace.package]
version = "0.1.3"
edition = "2021"
license = "BSD-3-Clause"

# Size-optimized release profile, scoped to the wasm binding only. The
# workspace's other crates (core, gpu) keep cargo's default release profile
# so `cargo run --release --example bench_native` reflects realistic native
# perf, not size-optimized codegen.
[profile.release.package.ngv-opx-wasm]
opt-level = "z"
codegen-units = 1

# LTO is a profile-level (not package-level) knob in Cargo. Keep it on for
# the whole release profile — it costs link time but the wasm binary needs
# it for size, and the native crates benefit from it too.
[profile.release]
lto = true
