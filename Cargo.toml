[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/gpu",
    "bindings/python",
]
# python binding is built via maturin (needs Python linker symbols);
# exclude from default `cargo build`/`cargo test` to avoid bare-cargo link failures.
default-members = [
    "crates/core",
    "crates/gpu",
]
