name: release-python-package

# PYTHON PACKAGE-ONLY RELEASE LANE (manual operator action).
#
# Use this for binding-only changes that do NOT need a Rust core release:
# packaging fixes, wheel metadata, type stubs, README corrections, etc.
#
# Prerequisite: a PR has already bumped the Python binding versions to the
# requested value and been merged to main:
#   - bindings/python/pyproject.toml  project.version
#   - bindings/python/Cargo.toml      package.version
#
# This workflow validates that state, builds the package as a dry run, and —
# only when dry_run=false — creates the scoped tag `python-vX.Y.Z` and
# dispatches publish-python.yml at that tag. The tag is created with
# GITHUB_TOKEN (which does NOT fire tag-push workflows), so we dispatch the
# publish explicitly to avoid a double publish.
#
# This lane never touches crates.io or npm.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to release, no leading v (e.g. 0.1.2). Must already be committed to main."
        required: true
        type: string
      dry_run:
        description: "Validate + build only; do not tag or publish."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Release ngv-opx ${{ inputs.version }} to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # create + push the scoped tag
      actions: write    # dispatch publish-python.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0   # need tags to check for collisions

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Validate semver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' is not a bare semver (X.Y.Z)"
            exit 1
          fi

      - name: Ensure scoped tag does not already exist
        env:
          TAG: python-v${{ inputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          echo "OK: $TAG is free"

      - name: Check manifest versions match requested version
        run: python3 scripts/check-release-versions.py --package python --version "${{ inputs.version }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Build wheel (smoke test that the package compiles at this version)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --release --out dist --no-default-features
          working-directory: bindings/python

      - name: Create and push scoped tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: python-v${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Python package release $TAG"
          git push origin "$TAG"

      - name: Dispatch publish-python.yml at scoped tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: python-v${{ inputs.version }}
        run: |
          set -euo pipefail
          gh workflow run publish-python.yml --ref "$TAG"
          echo "Dispatched publish-python.yml at $TAG"

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run complete. Validation + build passed for ${{ inputs.version }}."
          echo "Re-run with dry_run=false to tag python-v${{ inputs.version }} and publish."
