version: "3"

# All Python tasks run from bindings/python/ where pyproject.toml + uv.lock now
# live. Rust tasks run from workspace root.

tasks:
  list:
    desc: List all available tasks
    aliases: [l]
    cmd: task --list-all

  build:
    desc: Build the Rust extension into the bindings/python uv venv (release mode)
    dir: bindings/python
    cmd: uv run maturin develop --release

  test:
    desc: Run Rust workspace tests + Python pytest + JS parity tests
    cmds:
      - cargo test
      - task: test:py
      - task: test:js

  test:rust:
    desc: Rust workspace unit tests (core + gpu)
    cmd: cargo test

  test:py:
    desc: Python pytest suite (cross-validates Black-76 vs py_vollib)
    dir: bindings/python
    cmd: uv run pytest tests/

  test:js:
    desc: JS/wasm parity tests vs Python baseline (requires wasm-pack build first)
    dir: bindings/wasm
    cmds:
      - wasm-pack build --target nodejs --out-dir pkg-node
      - node tests/u4_black76.mjs
      - node tests/u5_iv.mjs
      - node tests/u8_package_shape.mjs

  # Bench/example tasks run from bindings/python so they pick up the venv where
  # `task build` installed the extension. The bench scripts themselves live at
  # the workspace-root benchmarks/ dir and resolve their own paths via
  # Path(__file__), so the relative invocation works regardless of CWD.

  bench:
    desc: CPU benchmark — {Python, Rust} x {single, vectorized} + py_vollib
    deps: [build]
    dir: bindings/python
    cmd: uv run python ../../benchmarks/bench_cpu.py

  bench:chart:
    desc: Plotly chart of the 5 pricing paths (writes benchmarks/bench_chart.{html,png})
    deps: [build]
    dir: bindings/python
    cmd: uv run python ../../benchmarks/bench_chart.py

  bench:readme:
    desc: Run benchmarks, regenerate bench_chart.{html,png}, and update README table
    deps: [build]
    dir: bindings/python
    cmd: uv run python ../../benchmarks/update_readme.py

  bench:all-pythons:
    desc: Run bench against Python 3.11, 3.12, 3.13 — saves JSON per version under benchmarks/results/
    dir: bindings/python
    cmd: bash ../../benchmarks/bench_all_pythons.sh

  bench:compare:
    desc: Cross-version comparison tables + Plotly chart (reads benchmarks/results/*.json)
    dir: bindings/python
    cmd: uv run python ../../benchmarks/bench_compare.py

  example:
    desc: Run the Black-76 IV roundtrip example on the crude oil surface
    deps: [build]
    dir: bindings/python
    cmd: uv run python ../../examples/example.py
