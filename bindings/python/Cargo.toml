[package]
name = "ngv-opx-python"
version = "0.1.3"
edition.workspace = true
license.workspace = true
description = "PyO3 Python bindings for ngv-opx."

[lib]
name = "ngv_opx"
crate-type = ["cdylib"]

[features]
# GPU support is opt-in for source builds (maturin develop --features gpu).
# Distribution wheels are built without it so they compile on headless CI
# runners (no DirectX/Metal SDK setup required). At runtime the Python API
# is identical — gpu_available() returns false and batch functions use CPU.
gpu = ["dep:ngv-opx-gpu"]

[dependencies]
ngv-opx-core = { path = "../../crates/core", version = "0.1.3" }
ngv-opx-gpu  = { path = "../../crates/gpu",  version = "0.1.3", optional = true }
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
